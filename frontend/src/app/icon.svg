<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- MailFlow mark (same as BrandMark in mail-client.tsx): two waves of mail flowing into a tray.
       No tile behind it; the colours switch with the browser's light or dark theme. -->
  <style>
    .front { stroke: #5944d8; } .back { stroke: #a99bff; }
    @media (prefers-color-scheme: dark) { .front { stroke: #b3a6ff; } .back { stroke: #7d69f5; } }
  </style>
  <g fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path class="back" d="M4 4.85c2.6 0 4.4 3.6 8 3.6s5.4-3.6 8-3.6"/>
    <path class="front" d="M4 9.65c2.6 0 4.4 3.6 8 3.6s5.4-3.6 8-3.6"/>
    <path class="front" d="M3.5 13.95v2.6a2.6 2.6 0 0 0 2.6 2.6h11.8a2.6 2.6 0 0 0 2.6-2.6v-2.6"/>
  </g>
</svg>
